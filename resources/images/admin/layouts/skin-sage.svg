<svg width="320" height="220" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sage skin preview">
  <defs>
    <linearGradient id="sg-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#596d69"/>
      <stop offset="1" stop-color="#c17a54"/>
    </linearGradient>
  </defs>

  <!-- Warm greige canvas -->
  <rect width="320" height="220" rx="10" fill="#f3f1ea"/>

  <!-- Cream sidebar -->
  <rect x="0" y="0" width="86" height="220" rx="10" fill="#faf8f1"/>
  <rect x="78" y="0" width="8" height="220" fill="#f3f1ea"/>
  <!-- brand -->
  <circle cx="20" cy="22" r="7" fill="#596d69"/>
  <rect x="32" y="19" width="28" height="7" rx="3.5" fill="#313a36"/>
  <!-- filled sage active pill -->
  <rect x="10" y="48" width="66" height="22" rx="8" fill="#596d69"/>
  <rect x="20" y="56" width="40" height="6" rx="3" fill="#ffffff"/>
  <!-- idle nav items -->
  <rect x="20" y="84" width="36" height="6" rx="3" fill="#6a6d62"/>
  <rect x="20" y="104" width="42" height="6" rx="3" fill="#6a6d62"/>
  <rect x="20" y="124" width="30" height="6" rx="3" fill="#6a6d62"/>
  <rect x="20" y="144" width="38" height="6" rx="3" fill="#6a6d62"/>

  <!-- Search/topbar pill -->
  <rect x="96" y="14" width="150" height="22" rx="11" fill="#faf8f1"/>
  <rect x="106" y="22" width="44" height="5" rx="2.5" fill="#cbc7b8"/>
  <circle cx="236" cy="25" r="3.5" fill="none" stroke="#b0ac9c" stroke-width="1.5"/>

  <!-- Stat cards with earthy tint chips -->
  <g>
    <rect x="96" y="48" width="68" height="44" rx="9" fill="#fcfbf7"/>
    <rect x="106" y="56" width="12" height="12" rx="4" fill="#596d69" opacity="0.16"/>
    <rect x="106" y="73" width="32" height="9" rx="3" fill="#313a36"/>
    <rect x="106" y="86" width="18" height="3.5" rx="1.75" fill="#5fa177"/>

    <rect x="172" y="48" width="68" height="44" rx="9" fill="#fcfbf7"/>
    <rect x="182" y="56" width="12" height="12" rx="4" fill="#c17a54" opacity="0.18"/>
    <rect x="182" y="73" width="32" height="9" rx="3" fill="#313a36"/>
    <rect x="182" y="86" width="18" height="3.5" rx="1.75" fill="#c8503f"/>

    <rect x="248" y="48" width="62" height="44" rx="9" fill="#596d69"/>
    <rect x="258" y="56" width="22" height="5" rx="2.5" fill="#c4cecb"/>
    <rect x="258" y="71" width="30" height="9" rx="3" fill="#ffffff"/>
    <rect x="258" y="86" width="18" height="3.5" rx="1.75" fill="#bcd0c4"/>
  </g>

  <!-- Line/area chart card -->
  <rect x="96" y="102" width="144" height="106" rx="9" fill="#fcfbf7"/>
  <rect x="106" y="112" width="52" height="8" rx="3" fill="#313a36"/>
  <path d="M106 184 L124 168 L142 176 L160 150 L178 160 L196 138 L214 148 L232 142 L232 196 L106 196 Z" fill="#596d69" opacity="0.1"/>
  <polyline points="106,184 124,168 142,176 160,150 178,160 196,138 214,148 232,142"
