  <polyline points="106,192 124,186 142,189 160,178 178,184 196,172 214,178 232,174"
            fill="none" stroke="#c17a54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" stroke-dasharray="4 4"/>

  <!-- Donut card -->
  <rect x="248" y="102" width="62" height="106" rx="9" fill="#fcfbf7"/>
  <g transform="translate(279,150)">
    <circle r="20" fill="none" stroke="#596d69" stroke-width="9"/>
    <circle r="20" fill="none" stroke="#c17a54" stroke-width="9" stroke-dasharray="34 92" transform="rotate(-90)"/>
    <circle r="20" fill="none" stroke="#5fa177" stroke-width="9" stroke-dasharray="26 100" transform="rotate(60)"/>
    <circle r="11" fill="#fcfbf7"/>
  </g>
  <rect x="258" y="186" width="44" height="5" rx="2.5" fill="#d8d3c4"/>
  <rect x="258" y="196" width="32" height="5" rx="2.5" fill="#e0dccd"/>
